name: CI Pipeline

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  archetype:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
      - name: Verificar pom.xml
        run: |
          if [ -f pom.xml ]; then
            echo "pom.xml found"
          else
            echo "Error: pom.xml not found."
            exit 1
          fi
      - name: Extraer coordenadas Maven
        id: coords
        run: |
          GROUP=$(mvn help:evaluate -Dexpression=project.groupId -q -DforceStdout)
          ARTIFACT=$(mvn help:evaluate -Dexpression=project.artifactId -q -DforceStdout)
          VERSION=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout)
          echo "group=${GROUP}" >> $GITHUB_OUTPUT
          echo "artifact=${ARTIFACT}" >> $GITHUB_OUTPUT
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
    outputs:
      group: ${{ steps.coords.outputs.group }}
      artifact: ${{ steps.coords.outputs.artifact }}
      version: ${{ steps.coords.outputs.version }}

  build:
    runs-on: ubuntu-22.04
    needs: archetype
    strategy:
      fail-fast: false
      matrix:
        java: ['21', '23']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: ${{ matrix.java }}
          distribution: 'temurin'
      - uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: maven-dependencies-${{ needs.archetype.outputs.artifact }}-${{ needs.archetype.outputs.version }}-jdk${{ matrix.java }}
      - run: mvn clean compile test package verify
      - name: Guardar JAR (solo JDK 21 y solo en master)
        if: matrix.java == '21' && github.ref == 'refs/heads/master'
        uses: actions/upload-artifact@v4
        with:
          name: jar
          path: target/*.jar
      - name: Guardar reporte de cobertura (solo JDK 21)
        if: matrix.java == '21'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: target/site/jacoco/
      - name: Aviso en pull request
        if: github.event_name == 'pull_request'
        run: |
          echo "Pull request: el JAR no se publica, solo se valida." >> $GITHUB_STEP_SUMMARY

  coverage-check:
    runs-on: ubuntu-22.04
    needs: build
    steps:
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
      - uses: actions/download-artifact@v4
        with:
          name: coverage-report
          path: ./reports
      - run: |
          THRESHOLD=80
          # jacoco.xml no tiene <line-rate> (eso es Cobertura): se usa el contador LINE global (el ultimo del fichero)
          LINE=$(grep -o '<counter type="LINE"[^>]*/>' ./reports/jacoco.xml | tail -n 1)
          MISSED=$(echo "$LINE" | grep -Po 'missed="\K[0-9]+')
          COVERED=$(echo "$LINE" | grep -Po 'covered="\K[0-9]+')
          if [ -z "$MISSED" ] || [ -z "$COVERED" ]; then
             echo "Could not read coverage from jacoco.xml"
             exit 1
          fi
          COVERAGE=$(awk -v m="$MISSED" -v c="$COVERED" 'BEGIN {printf "%.2f", c * 100 / (m + c)}')
          if (( $(echo "$COVERAGE < $THRESHOLD" | bc -l) )); then
             echo "Coverage below threshold: $COVERAGE%"
             exit 1
          fi
          echo "Coverage meets the threshold: $COVERAGE%"
