name: CI Pipeline

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  archetype:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
      - name: Verificar pom.xml
        run: |
          if [ -f pom.xml ]; then
            echo "pom.xml found"
          else
            echo "Error: pom.xml not found."
            exit 1
          fi
      - name: Extraer coordenadas Maven
        id: coords
        run: |
          GROUP=$(mvn help:evaluate -Dexpression=project.groupId -q -DforceStdout)
          ARTIFACT=$(mvn help:evaluate -Dexpression=project.artifactId -q -DforceStdout)
          VERSION=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout)
          echo "group=${GROUP}" >> $GITHUB_OUTPUT
          echo "artifact=${ARTIFACT}" >> $GITHUB_OUTPUT
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
    outputs:
      group: ${{ steps.coords.outputs.group }}
      artifact: ${{ steps.coords.outputs.artifact }}
      version: ${{ steps.coords.outputs.version }}

  build:
    runs-on: ubuntu-22.04
    needs: archetype
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
      - uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: >
            maven-dependencies-
            {{ needs.archetype.outputs.artifact }}-
            {{ needs.archetype.outputs.version }}
      - run: mvn clean compile test package verify
      - uses: actions/upload-artifact@v4
        with:
          name: jar
          path: target/*.jar
      - uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: target/site/jacoco/jacoco.xml

  coverage-check:
    runs-on: ubuntu-22.04
    needs: build
    steps:
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
      - uses: actions/download-artifact@v4
        with:
          name: coverage-report
          path: ./reports
      - run: |
          THRESHOLD=80
          COVERAGE=$(grep -Po '<line-rate>\K[0-9.]*' ./reports/jacoco.xml |
             awk '{print $1 * 100}')
          if (( $(echo "$COVERAGE < $THRESHOLD" | bc -l) )); then
             echo "Coverage below threshold: $COVERAGE%"
             exit 1
          fi
          echo "Coverage meets the threshold: $COVERAGE%"
